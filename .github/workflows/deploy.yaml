name: Deploy

# Deploys the 3-service trading system (Analyst CronJob, Dealer Deployment,
# Floor Broker Deployment+Service) to K3s on the DGX. CPU-only — no GPU node
# handling, no cloud registry, no WIF.
#
# The mlabs-api-keys secret (broker/LLM API credentials) is NOT created here —
# it must already exist in the namespace (see k8s/secrets.example.yaml).
# The portfolio and buy-kill-switch ConfigMaps are seeded once and never clobbered on re-deploy.
#
# Run undeploy.yaml to tear the whole namespace down.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy for all 3 services"
        required: false
        default: latest

permissions:
  contents: read

env:
  PROJECT_NAME: "multi-agent-ai-trader"

jobs:
  deploy-dgx:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "KUBECONFIG=${HOME}/.kube/config" >> "${GITHUB_ENV}"

      - name: Ensure namespace
        run: kubectl create namespace "$PROJECT_NAME" --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=miramar-labs-org \
            --docker-password="${{ secrets.MIRAMAR_ORG_GHCR_PAT }}" \
            -n "$PROJECT_NAME" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Ensure mlabs-api-keys secret
        run: |
          kubectl get secret mlabs-api-keys -n "$PROJECT_NAME" > /dev/null 2>&1 || {
            echo "ERROR: secret mlabs-api-keys not found in namespace $PROJECT_NAME."
            echo "Create it manually first — see k8s/secrets.example.yaml for the required keys."
            exit 1
          }

      - name: Apply RBAC
        run: kubectl apply --validate=false -f k8s/rbac.yaml

      - name: Seed portfolio ConfigMap (once)
        run: |
          kubectl get configmap portfolio -n "$PROJECT_NAME" > /dev/null 2>&1 || \
            kubectl apply --validate=false -f k8s/portfolio-configmap.yaml

      - name: Seed buy-kill-switch ConfigMap (once)
        run: |
          kubectl get configmap buy-kill-switch -n "$PROJECT_NAME" > /dev/null 2>&1 || \
            kubectl apply --validate=false -f k8s/buy-kill-switch-configmap.yaml

      - name: Build image URIs
        id: images
        run: |
          TAG="${{ inputs.image_tag }}"
          echo "analyst=ghcr.io/miramar-labs-org/${PROJECT_NAME}-analyst:${TAG}" >> "$GITHUB_OUTPUT"
          echo "dealer=ghcr.io/miramar-labs-org/${PROJECT_NAME}-dealer:${TAG}" >> "$GITHUB_OUTPUT"
          echo "floor_broker=ghcr.io/miramar-labs-org/${PROJECT_NAME}-floor-broker:${TAG}" >> "$GITHUB_OUTPUT"
          echo "eod_report=ghcr.io/miramar-labs-org/${PROJECT_NAME}-eod-report:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Substitute and apply k3s manifests
        run: |
          ANALYST_URI="${{ steps.images.outputs.analyst }}"
          DEALER_URI="${{ steps.images.outputs.dealer }}"
          FLOOR_BROKER_URI="${{ steps.images.outputs.floor_broker }}"
          EOD_REPORT_URI="${{ steps.images.outputs.eod_report }}"
          COMMIT_SHA="${{ github.sha }}"

          for MANIFEST in \
            k8s/analyst-cronjob-k3s.yaml \
            k8s/dealer-deployment-k3s.yaml \
            k8s/floor-broker-deployment-k3s.yaml \
            k8s/floor-broker-service-k3s.yaml \
            k8s/eod-report-cronjob-k3s.yaml
          do
            echo "Applying ${MANIFEST}..."
            sed "s|GHCR_IMAGE_ANALYST_PLACEHOLDER|${ANALYST_URI}|g" "${MANIFEST}" \
              | sed "s|GHCR_IMAGE_DEALER_PLACEHOLDER|${DEALER_URI}|g" \
              | sed "s|GHCR_IMAGE_FLOOR_BROKER_PLACEHOLDER|${FLOOR_BROKER_URI}|g" \
              | sed "s|GHCR_IMAGE_EOD_REPORT_PLACEHOLDER|${EOD_REPORT_URI}|g" \
              | sed "s|DEPLOY_SHA_PLACEHOLDER|${COMMIT_SHA}|g" \
              | kubectl apply --validate=false -f -
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dealer -n "$PROJECT_NAME" --timeout=300s
          kubectl rollout status deployment/floor-broker -n "$PROJECT_NAME" --timeout=300s

      - name: Smoke test
        run: |
          kubectl port-forward svc/floor-broker 18000:8000 -n "$PROJECT_NAME" &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT
          sleep 5

          curl -sf http://localhost:18000/healthz
          echo "Floor Broker healthz OK"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy: $PROJECT_NAME (DGX K3s)"
            echo "| Service | Image |"
            echo "|---|---|"
            echo "| Analyst | \`${{ steps.images.outputs.analyst }}\` |"
            echo "| Dealer | \`${{ steps.images.outputs.dealer }}\` |"
            echo "| Floor Broker | \`${{ steps.images.outputs.floor_broker }}\` |"
            echo "| EOD Report | \`${{ steps.images.outputs.eod_report }}\` |"
            echo ""
            echo "Namespace: \`$PROJECT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
