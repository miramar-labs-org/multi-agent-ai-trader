name: Test and Lint

# Runs the pytest suite and ruff lint checks on every push and pull request. Self-hosted DGX
# runner, matching build-push/deploy/undeploy — installs its own throwaway venv from
# requirements-dev.txt (which pins the same ruff version used locally) rather than relying on
# any tool already on the runner's PATH, so this job is reproducible independent of how the
# runner host happens to be provisioned. `python3-venv` itself is baked into the shared
# mlabs-runner image (miramar-platform-gcp/mlabs-runner/Dockerfile) rather than apt-installed
# here on every run -- that used to require sudo/root, modify the runner host, and add avoidable
# runtime on every job (see docs/ROADMAP.md's P0.12 entry).
#
# ruff format --check is intentionally NOT run here yet — there is pre-existing formatting
# drift across the repo that hasn't been cleaned up (see docs/architecture.md), so enforcing it
# in CI would fail on unrelated files. ruff check (lint rules) has no such drift and is safe to
# gate on.
#
# Runs on Python 3.11, NOT 3.12 — the [self-hosted, dgx] runner container
# (ghcr.io/miramar-labs-org/mlabs-runner) only ships 3.11 (Debian 12 bookworm's default;
# 3.12 isn't in bookworm's apt repos at all). This is a real, documented gap vs. the 3.12
# every Dockerfile.* and the local dev pyenv environment actually run — see README.md's
# Development section and docs/ROADMAP.md's P0.12 entry.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: [self-hosted, dgx]
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        run: |
          python3.11 -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install -r requirements-dev.txt

      - name: Ruff check
        run: .venv-ci/bin/ruff check .

      - name: Pytest
        run: .venv-ci/bin/pytest -q

      - name: Clean up virtualenv
        if: always()
        run: rm -rf .venv-ci
