description: "3-agent trading floor (Analyst / Dealer / Floor Broker) — Analyst picks the tradeable universe, Dealer decides BUY/HOLD/SELL, Floor Broker executes on Alpaca."

llm:
  base_url: "http://192.168.1.200:11434/v1"  # DGX_HOST_IP — Ollama systemd service on DGX (not in k3s)
  model: "qwen3.6:35b-a3b"                   # see docs/models.md for model choice + Ollama-vs-vLLM decision
  temperature: 0.1

langsmith:
  enabled: true
  project: "multi-agent-ai-trader"   # requires LANGCHAIN_API_KEY in the mlabs-api-keys secret
  sampling_rate: 0.5   # caps Dealer's poll-driven trace volume under the free Developer plan's 5k traces/month limit

slack:
  enabled: true   # requires SLACK_WEBHOOK_URL2 in the mlabs-api-keys secret; posts to #miramar-trading-floor

floor_broker:
  base_url: "http://floor-broker.multi-agent-ai-trader.svc.cluster.local:8000"

trading:
  slP: 0.98
  tpP: 1.05
  pollsecs: 600
  buffer: 15
  market_override: false
  enable_stocks: true         # set false to pause Analyst/Dealer handling of equities entirely
  enable_crypto: true         # crypto merge/trading verified live (BTC/USD test buy + Analyst crypto picks)
  crypto_taapi_exchange: "binance"   # TAAPI venue used for indicator requests on crypto symbols

ohlcv_enrichment:
  enabled: false            # /revert-strategy baseline disables Stage 2 Dealer OHLCV enrichment
  timeframes: ["5m", "1h", "1d"]
  bar_count: 60
  realized_vol_window: 20
  atr_period: 14
  distance_window: 20

# Written/updated by /configure-strategy (skills/configure-strategy/SKILL.md); reverted to
# baseline by /revert-strategy. Enforced directly by src/floor_broker/execution.py -- see that
# module's buy()/check_pending_fills()/check_crypto_stops() for exactly which fields are live.
strategy:
  daily_profit_target_usd: 1000   # blocks new BUYs once today's equity gain reaches this
  daily_loss_limit_usd: 500       # blocks new BUYs once today's equity loss reaches this
  halt_behavior: block_new_buys   # only this is enforced; flatten_positions is recorded intent only
  crypto_slP: 0.98                # synthetic stop-loss, as a fraction of crypto fill price
  crypto_tpP: 1.03                # synthetic take-profit, as a fraction of crypto fill price
  position_sizing: flat_budget    # only this is enforced (analyst.default_budget); risk_based is recorded intent only
  risk_per_trade_usd: null        # recorded intent only -- see position_sizing note above
  max_concurrent_positions: 10    # recorded intent only -- analyst.max_universe_size already caps concurrent picks
  win_rate_throttle_scope: symbol
  enable_symbol_stop_cooldown: true
  symbol_stop_cooldown_days: 1
  max_symbol_stop_losses: 1
  enable_dealer_memory: true
  symbol_memory_days: 2
  symbol_memory_limit: 8
  max_bid_ask_spread_pct: 0.03

eod_report:
  schedule: "30 21 * * *"   # informational copy of the CronJob's own spec.schedule — 21:30 UTC daily, after
                            # market close; runs every day so closed days get a Slack notice, not silence

analyst:
  schedule: "55 8 * * *"      # informational copy of the CronJob's own spec.schedule — 08:55 America/New_York
                               # daily (spec.timeZone), ~30min before the 9:30 ET open
  max_universe_size: 10
  default_budget: 5000
  screener_top_n: 20          # candidates pulled from Alpaca Screener before research/filtering
  min_price_usd: 1.0          # screener candidates below this price are dropped (movers only -- see
                               # sources.py; most-actives has no price field to filter on). Sub-$1
                               # stocks can fail Floor Broker's SL/TP bracket math (see execution.py's
                               # $0.02 floor/ceiling clamp in bracket_buy_with_SLTP)
  max_abs_change_pct: 40.0
  min_dollar_volume_usd: 1000000
  excluded_symbol_suffixes: [".W", ".WS", "WS", "WT", "U"]
  news_days: 2
  yahoo_rss_url: "https://feeds.finance.yahoo.com/rss/2.0/headline"
  indicator_fetch_limit: 15   # candidates (by |change_pct|) that get real TAAPI indicator data,
                               # capped for TAAPI's 15s/request free-tier rate limit
  large_cap_symbols: ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META", "TSLA", "JPM", "V", "JNJ",
                       "WMT", "PG", "HD", "MA", "XOM"]
                               # candidate pool for candidate_mix's large-cap bucket below, and always
                               # gets real indicator data (fetch_indicators) regardless of the day's
                               # movers ranking. Order doesn't matter, just needs enough names to
                               # fill large_cap_pct's target count.
  candidate_mix:
    enabled: true              # feature gate: compose the stock+crypto candidate pool as a fixed
                                # percentage mix (large-cap / crypto / today's screener movers)
                                # instead of letting the day's movers ranking alone decide what the
                                # LLM sees. false = fall back to today's screener+crypto-only
                                # discovery. Config-only change, no redeploy needed.
    pool_size: 20               # total size of the mixed candidate pool when enabled
    large_cap_pct: 0.40         # fraction of pool_size drawn from large_cap_symbols
    crypto_pct: 0.30            # fraction of pool_size drawn from crypto (screener movers + the
                                 # fixed CRYPTO_WATCHLIST); silently redistributed to the other
                                 # buckets when trading.enable_crypto is false
    screener_pct: 0.30          # fraction of pool_size drawn from today's screener movers/most-
                                 # actives ("weird stocks"), excluding any symbol already in
                                 # large_cap_symbols

taapi:
  min_request_interval_secs: 15   # matches the TAAPI Free plan's 1 request/15s cap; lower if you upgrade (Basic ~3s, Pro/Expert ~1s)

backtest:
  default_symbols: ["NVDA", "AAPL", "MSFT", "BTC/USD"]
  lookback_days: 365
  slippage_bps: 5   # basis points of slippage assumed on every simulated fill

# Indicator catalog — unchanged shape from gpt-trader's config.json, TAAPI query params per indicator.
indicators:
  - name: rsi
    properties: { interval: 1h, backtrack: 0, period: 14 }
  - name: stochrsi
    properties: { interval: 1h, backtrack: 0, kPeriod: 5, dPeriod: 3, rsiPeriod: 14, stochasticPeriod: 14 }
  - name: vwap
    properties: { interval: 1h, backtrack: 0, anchorPeriod: week }
  - name: vosc
    properties: { interval: 1h, backtrack: 0, short_period: 5, long_period: 10 }
  - name: volume
    properties: { interval: 1h, backtrack: 0 }
  - name: bbands
    properties: { interval: 1h, backtrack: 0, period: 20, stddev: 2 }
  - name: macd
    properties: { interval: 1h, backtrack: 0, optInFastPeriod: 12, optInSlowPeriod: 26, optInSignalPeriod: 9 }
  - name: ema
    properties: { interval: 1h, backtrack: 0, period: 30 }
  - name: sma
    properties: { interval: 1h, backtrack: 0, period: 30 }
