description: "3-agent trading floor (Analyst / Dealer / Floor Broker) — Analyst picks the tradeable universe, Dealer decides BUY/HOLD/SELL, Floor Broker executes on Alpaca."

llm:
  base_url: "http://192.168.1.200:11434/v1"  # DGX_HOST_IP — Ollama systemd service on DGX (not in k3s)
  model: "qwen3.6:35b-a3b"                   # see docs/models.md for model choice + Ollama-vs-vLLM decision
  temperature: 0.1

langsmith:
  enabled: true
  project: "multi-agent-ai-trader"   # requires LANGCHAIN_API_KEY in the mlabs-api-keys secret
  sampling_rate: 0.5   # caps Dealer's poll-driven trace volume under the free Developer plan's 5k traces/month limit

slack:
  enabled: true   # requires SLACK_WEBHOOK_URL2 in the mlabs-api-keys secret; posts to #miramar-trading-floor

floor_broker:
  base_url: "http://floor-broker.multi-agent-ai-trader.svc.cluster.local:8000"

trading:
  slP: 0.98
  tpP: 1.05
  pollsecs: 600
  buffer: 15
  market_override: false
  enable_stocks: true         # set false to pause Analyst/Dealer handling of equities entirely
  enable_crypto: true         # crypto merge/trading verified live (BTC/USD test buy + Analyst crypto picks)
  crypto_taapi_exchange: "binance"   # TAAPI venue used for indicator requests on crypto symbols

# Written/updated by /configure-strategy (skills/configure-strategy/SKILL.md); reverted to
# baseline by /revert-strategy. Enforced directly by src/floor_broker/execution.py -- see that
# module's buy()/check_pending_fills()/check_crypto_stops() for exactly which fields are live.
strategy:
  daily_profit_target_usd: 1000   # blocks new BUYs once today's equity gain reaches this
  daily_loss_limit_usd: 2500      # blocks new BUYs once today's equity loss reaches this -- set
                                   # to 2500 on 2026-08-05, see docs/strategy.md
  halt_behavior: block_new_buys   # only this is enforced; flatten_positions is recorded intent only
  crypto_slP: 0.98                # synthetic stop-loss, as a fraction of crypto fill price
  crypto_tpP: 1.03                # synthetic take-profit, as a fraction of crypto fill price
  position_sizing: flat_budget    # only this is enforced (analyst.default_budget); risk_based is recorded intent only
  risk_per_trade_usd: null        # recorded intent only -- see position_sizing note above
  max_concurrent_positions: 10    # recorded intent only -- analyst.max_universe_size already caps concurrent picks

eod_flatten:
  enabled: true   # feature gate: when false, poll_eod_flatten() (src/floor_broker/main.py) short-
                   # circuits every iteration before touching the clock or Alpaca positions -- off
                   # by default, opt-in "day trading mode". Toggling this is a config-only change --
                   # no rebuild/redeploy needed, see src/common/config.py.
  minutes_before_close: 10   # start flattening open stock positions once Alpaca's live clock
                              # reports this many minutes (or fewer) until market close. Crypto is
                              # 24/7 and untouched by this feature.
  conditional: false   # when true: only flatten if aggregate unrealized P&L across open stock
                        # positions is >= 0 ("UP"); when P&L is negative ("DOWN"), hold everything
                        # overnight instead -- except any position held >= max_days_held_loss days,
                        # which is force-flattened regardless of the aggregate sign. When false
                        # (default), behaves exactly as today: always flattens everything.
  max_days_held_loss: 5   # only consulted when conditional: true -- caps how long a losing
                           # position can ride through consecutive DOWN days before being
                           # force-flattened regardless of the aggregate P&L sign.

earnings_blackout:
  enabled: true    # feature gate: when false, discover_candidates() never calls Finnhub and the
                   # stock screener list is unfiltered by earnings dates -- same config-only-
                   # toggle story as eod_flatten.enabled. Requires FINNHUB_API_KEY in the
                   # mlabs-api-keys secret (verified working 2026-08-05). Toggling this is a
                   # config-only change -- no rebuild/redeploy needed, see src/common/config.py.
  days_before: 2   # drop a screener candidate if it's reporting earnings within this many
                   # calendar days from today (anticipation/IV-crush risk pre-report)
  days_after: 1    # drop a screener candidate if it reported earnings within this many calendar
                   # days before today (post-report gap risk) -- covers both BMO and AMC
                   # reporters without permanently excluding a symbol for a full week

macro_blackout:
  enabled: true    # feature gate: when false, call_floor_broker() never checks the macro
                   # calendar and BUY entries proceed as today. SELL/HOLD/eod_flatten are never
                   # affected by this flag, only new BUY entries. Toggling this is a config-only
                   # change -- no rebuild/redeploy needed. Quarterly quad witching days (3rd
                   # Friday of Mar/Jun/Sep/Dec) are auto-detected in code
                   # (src/dealer/graph.py:_is_quad_witching_day) and always included when this
                   # is enabled -- no config entry needed for those.
  dates:           # hand-maintained list of other major scheduled macro releases that can move
                   # the whole market, not just individual stocks. Whole-trading-day granularity
                   # -- a listed date pauses BUY entries for the entire day, not just around the
                   # release hour. Sourced 2026-08-05 from federalreserve.gov (FOMC),
                   # bls.gov/schedule (CPI, Employment Situation/NFP), and bea.gov/news/schedule
                   # (Personal Income and Outlays/PCE) -- covers the remainder of 2026. Update
                   # quarterly from those same three sites; also worth adding in a future pass:
                   # FOMC meeting minutes (3wk after each decision), PPI, ISM Manufacturing/
                   # Services PMI, GDP (advance/preliminary/final), and the Fed Chair's
                   # semiannual (Humphrey-Hawkins) testimony.
    - date: "2026-08-12"
      label: "CPI release"
    - date: "2026-08-26"
      label: "PCE release"
    - date: "2026-09-04"
      label: "NFP / jobs report"
    - date: "2026-09-11"
      label: "CPI release"
    - date: "2026-09-16"
      label: "FOMC rate decision"
    - date: "2026-09-30"
      label: "PCE release"
    - date: "2026-10-02"
      label: "NFP / jobs report"
    - date: "2026-10-14"
      label: "CPI release"
    - date: "2026-10-28"
      label: "FOMC rate decision"
    - date: "2026-10-29"
      label: "PCE release"
    - date: "2026-11-06"
      label: "NFP / jobs report"
    - date: "2026-11-10"
      label: "CPI release"
    - date: "2026-11-25"
      label: "PCE release"
    - date: "2026-12-04"
      label: "NFP / jobs report"
    - date: "2026-12-09"
      label: "FOMC rate decision"
    - date: "2026-12-10"
      label: "CPI release"
    - date: "2026-12-23"
      label: "PCE release"

eod_report:
  schedule: "30 13-16 * * *"   # informational copy of the CronJob's own spec.schedule — checks
                               # hourly at :30 from 13:30 through 16:30 America/New_York. The
                               # EOD code uses Alpaca's official close and posts once at close+30min.
                               # Runs every day so closed days get one Slack notice, not silence.

analyst:
  schedule: "55 8 * * *"      # informational copy of the CronJob's own spec.schedule — 08:55 America/New_York
                               # daily (spec.timeZone), ~30min before the 9:30 ET open
  enable_midday_run: true     # feature gate: optional second Analyst run at ~12:30pm ET to catch
                               # intraday movers/news the 08:55 run missed. Opt-in, now enabled.
                               # Toggling this is a config-only change -- no rebuild/redeploy needed,
                               # see src/common/config.py.
  midday_schedule: "30 12 * * *"   # informational copy of k8s/analyst-midday-cronjob-k3s.yaml's own
                                    # spec.schedule -- not read by code, keep in sync by hand (same
                                    # convention as the `schedule` field above)
  enable_news: true           # feature gate: Alpaca News API + Yahoo RSS headlines as an Analyst input
  enable_indicators: true     # feature gate: TAAPI technical indicator data as an Analyst input
  enable_track_record: true   # feature gate: Analyst's own recent pick history + Dealer/Floor
                               # Broker outcomes as an Analyst input (read-only Postgres query)
  track_record_days: 5        # lookback window in calendar days; excludes today by construction
                               # -- this node runs before write_portfolio's DB write in the same run
  enable_position_pnl: true   # feature gate: live unrealized P&L snapshot of currently-open Alpaca
                               # positions (stocks + crypto) as an Analyst input -- a fresh
                               # trading_client.get_all_positions() call each run, point-in-time
                               # only, not persisted, not compared across days; complements the
                               # qualitative track_record above rather than replacing it
  max_universe_size: 10
  default_budget: 5000
  max_total_budget_usd: 50000  # last-line-of-defense cap on the sum of every pick's budget in one
                                # selection -- per-pick budget has no upper bound of its own, and
                                # the LLM's default_budget above is only a suggestion it can ignore.
                                # validate_selection() drops trailing picks once the running total
                                # would exceed this. Default = max_universe_size x default_budget
                                # (i.e. no headroom beyond "every pick sized at the suggested
                                # default"), see docs/architecture.md.
  screener_top_n: 20          # candidates pulled from Alpaca Screener before research/filtering
  min_price_usd: 1.0          # screener candidates below this price are dropped (movers only -- see
                               # sources.py; most-actives has no price field to filter on). Sub-$1
                               # stocks can fail Floor Broker's SL/TP bracket math (see execution.py's
                               # $0.02 floor/ceiling clamp in bracket_buy_with_SLTP)
  news_days: 2
  yahoo_rss_url: "https://feeds.finance.yahoo.com/rss/2.0/headline"
  indicator_fetch_limit: 15   # candidates (by |change_pct|) that get real TAAPI indicator data,
                               # capped for TAAPI's 15s/request free-tier rate limit

taapi:
  min_request_interval_secs: 15   # matches the TAAPI Free plan's 1 request/15s cap; lower if you upgrade (Basic ~3s, Pro/Expert ~1s)

backtest:
  default_symbols: ["NVDA", "AAPL", "MSFT", "BTC/USD"]
  lookback_days: 365
  slippage_bps: 5   # basis points of slippage assumed on every simulated fill

# Indicator catalog — unchanged shape from gpt-trader's config.json, TAAPI query params per indicator.
indicators:
  - name: rsi
    properties: { interval: 1h, backtrack: 0, period: 14 }
  - name: stochrsi
    properties: { interval: 1h, backtrack: 0, kPeriod: 5, dPeriod: 3, rsiPeriod: 14, stochasticPeriod: 14 }
  - name: vwap
    properties: { interval: 1h, backtrack: 0, anchorPeriod: week }
  - name: vosc
    properties: { interval: 1h, backtrack: 0, short_period: 5, long_period: 10 }
  - name: volume
    properties: { interval: 1h, backtrack: 0 }
  - name: bbands
    properties: { interval: 1h, backtrack: 0, period: 20, stddev: 2 }
  - name: macd
    properties: { interval: 1h, backtrack: 0, optInFastPeriod: 12, optInSlowPeriod: 26, optInSignalPeriod: 9 }
  - name: ema
    properties: { interval: 1h, backtrack: 0, period: 30 }
  - name: sma
    properties: { interval: 1h, backtrack: 0, period: 30 }
