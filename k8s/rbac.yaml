# Shared by the Analyst CronJob (writes the portfolio ConfigMap), the Dealer
# Deployment (reads it), and the Floor Broker Deployment (reads the
# buy-kill-switch ConfigMap, ROADMAP P0.5) — one ServiceAccount/Role/RoleBinding
# rather than near-duplicate RBAC objects per workload, since all three only
# ever touch ConfigMaps in this same namespace. EOD Report does not use this
# ServiceAccount — it never touches the k8s API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-agent-ai-trader-configmap-reader
  namespace: multi-agent-ai-trader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-agent-ai-trader-configmap-reader
  namespace: multi-agent-ai-trader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "patch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-agent-ai-trader-configmap-reader
  namespace: multi-agent-ai-trader
subjects:
  - kind: ServiceAccount
    name: multi-agent-ai-trader-configmap-reader
    namespace: multi-agent-ai-trader
roleRef:
  kind: Role
  name: multi-agent-ai-trader-configmap-reader
  apiGroup: rbac.authorization.k8s.io
---
# Dedicated to the Power Scheduler CronJob -- kept separate from the configmap-reader
# ServiceAccount above rather than widening its scope, since scaling Deployments is a
# different (and more sensitive) capability than reading/writing ConfigMaps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-agent-ai-trader-power-scheduler
  namespace: multi-agent-ai-trader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-agent-ai-trader-power-scheduler
  namespace: multi-agent-ai-trader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-agent-ai-trader-power-scheduler
  namespace: multi-agent-ai-trader
subjects:
  - kind: ServiceAccount
    name: multi-agent-ai-trader-power-scheduler
    namespace: multi-agent-ai-trader
roleRef:
  kind: Role
  name: multi-agent-ai-trader-power-scheduler
  apiGroup: rbac.authorization.k8s.io
