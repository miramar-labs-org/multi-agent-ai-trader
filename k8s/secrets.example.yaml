# EXAMPLE ONLY — do not apply this file. Create the real secret manually with:
#   kubectl create secret generic mlabs-api-keys -n multi-agent-ai-trader \
#     --from-literal=TAAPI_API_KEY=... \
#     --from-literal=ALPACA_PAPER_API_KEY=... \
#     --from-literal=ALPACA_PAPER_API_SECRET=... \
#     --from-literal=LANGCHAIN_API_KEY=... \
#     --from-literal=SLACK_WEBHOOK_URL2=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=FINNHUB_API_KEY=...
# DATABASE_URL comes from miramar-platform-gcp's deploy-postgres.yaml workflow
# (per-consumer provisioning output) -- see dgx/k3s/postgres/README.md there.
# Never commit real values, and no workflow applies this file automatically.
apiVersion: v1
kind: Secret
metadata:
  name: mlabs-api-keys
  namespace: multi-agent-ai-trader
type: Opaque
stringData:
  TAAPI_API_KEY: "REPLACE_ME"
  ALPACA_PAPER_API_KEY: "REPLACE_ME"
  ALPACA_PAPER_API_SECRET: "REPLACE_ME"
  LANGCHAIN_API_KEY: "REPLACE_ME"
  SLACK_WEBHOOK_URL2: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  FINNHUB_API_KEY: "REPLACE_ME"
