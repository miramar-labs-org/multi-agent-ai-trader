# EXAMPLE ONLY — do not apply this file. Create the real secret manually with:
#   kubectl create secret generic mlabs-api-keys -n multi-agent-ai-trader \
#     --from-literal=TAAPI_API_KEY=... \
#     --from-literal=ALPACA_PAPER_API_KEY=... \
#     --from-literal=ALPACA_PAPER_API_SECRET=... \
#     --from-literal=ALPACA_PAPER_API_KEY2=... \
#     --from-literal=ALPACA_PAPER_API_SECRET2=... \
#     --from-literal=LANGCHAIN_API_KEY=... \
#     --from-literal=SLACK_WEBHOOK_URL2=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=FINNHUB_API_KEY=... \
#     --from-literal=GITHUB_WORKFLOW_TOKEN=...
# DATABASE_URL comes from miramar-platform-gcp's deploy-postgres.yaml workflow
# (per-consumer provisioning output) -- see dgx/k3s/postgres/README.md there.
# Never commit real values, and no workflow applies this file automatically.
#
# The whole floor -- stocks, crypto and options -- trades on one "live" paper account, named by
# config.yaml's `alpaca.live.key_env`/`secret_env` (see src/common/alpaca_client.py). To be able
# to move it to a different account at runtime (e.g. the competition's $100k Level-3 account, the
# ...KEY2/SECRET2 pair below), add that account's key/secret under its own distinct name here
# first, e.g.:
#     --from-literal=ALPACA_PAPER_API_KEY_DEVTEST=... \
#     --from-literal=ALPACA_PAPER_API_SECRET_DEVTEST=...
# then restart the affected pod(s) once so the new env vars are present (env var *values* are
# fixed at pod start). After that, switching is a config.yaml edit alone -- point
# alpaca.live.key_env/secret_env at ALPACA_PAPER_API_KEY_DEVTEST/ALPACA_PAPER_API_SECRET_DEVTEST
# -- picked up within config's normal 60s refresh, no redeploy.
# `kubectl edit secret mlabs-api-keys -n multi-agent-ai-trader` adds a key to the existing secret
# without recreating it (see `stringData` there for reference, it's the same shape as below).
apiVersion: v1
kind: Secret
metadata:
  name: mlabs-api-keys
  namespace: multi-agent-ai-trader
type: Opaque
stringData:
  TAAPI_API_KEY: "REPLACE_ME"
  ALPACA_PAPER_API_KEY: "REPLACE_ME"
  ALPACA_PAPER_API_SECRET: "REPLACE_ME"
  ALPACA_PAPER_API_KEY2: "REPLACE_ME"
  ALPACA_PAPER_API_SECRET2: "REPLACE_ME"
  LANGCHAIN_API_KEY: "REPLACE_ME"
  SLACK_WEBHOOK_URL2: "REPLACE_ME"
  DATABASE_URL: "REPLACE_ME"
  FINNHUB_API_KEY: "REPLACE_ME"
  # Fine-grained token with Actions write access for this repo. Used by EOD Report to dispatch
  # .github/workflows/pl-badges.yaml immediately after a successful Slack EOD recap.
  GITHUB_WORKFLOW_TOKEN: "REPLACE_ME"
